name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: fieldops
          POSTGRES_USER: fieldops
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldops -d fieldops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      ConnectionStrings__Database: Host=localhost;Port=5432;Database=fieldops;Username=fieldops;Password=local_ci_only
      FIELDOPS_TEST_DATABASE: Host=localhost;Port=5432;Database=postgres;Username=fieldops;Password=local_ci_only
      Jwt__SigningKey: ci_test_only_key_not_for_deployment_0123456789_abcdefghijklmnopqrstuv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          # Same feature band as global.json; CI uses the current servicing patch.
          dotnet-version: '10.0.403'
          cache: true
          cache-dependency-path: backend/**/packages.lock.json
      - run: dotnet tool restore
      - run: dotnet restore backend/FieldOps.slnx --locked-mode
      - run: dotnet build backend/FieldOps.slnx --configuration Release --no-restore
      - run: dotnet format backend/FieldOps.slnx --verify-no-changes --no-restore
      - name: Apply database migrations
        run: dotnet ef database update --project backend/src/FieldOps.Infrastructure --startup-project backend/src/FieldOps.Api --configuration Release --no-build
      - name: Unit and integration tests (including real PostgreSQL)
        run: dotnet test backend/FieldOps.slnx --configuration Release --no-build --logger "trx;LogFilePrefix=fieldops"
  clients:
    name: ${{ matrix.client }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        client: [web, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm ls --all --json > /dev/null
      - run: npm run ${{ matrix.client }}:lint
      - run: npm run ${{ matrix.client }}:typecheck
      - run: npm run ${{ matrix.client }}:test
      - if: matrix.client == 'web'
        run: npm run web:build
      - if: matrix.client == 'web'
        run: npm run format:check --workspace=@fieldops/admin-web
      - if: matrix.client == 'mobile'
        run: npm run format:check --workspace=@fieldops/mobile
      - if: matrix.client == 'mobile'
        name: Check Expo dependency compatibility
        run: npx expo install --check
        working-directory: apps/mobile
      - if: matrix.client == 'mobile'
        name: Bundle Android and iOS JavaScript
        run: npm run mobile:export
      - if: matrix.client == 'mobile'
        name: Start Metro and request an Android JavaScript bundle
        run: npm run mobile:smoke

  infrastructure:
    name: Docker infrastructure smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.403'
      - name: Configure disposable local stack
        run: |
          cp .env.example .env
          printf 'JWT_SIGNING_KEY=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          mkdir .certs
          cert_password="$(openssl rand -hex 24)"
          echo "::add-mask::$cert_password"
          printf 'FIELDOPS_HTTPS_CERT_PASSWORD=%s\n' "$cert_password" >> "$GITHUB_ENV"
          dotnet dev-certs https -ep .certs/fieldops.pfx -p "$cert_password"
          dotnet dev-certs https -ep .certs/fieldops.crt --format PEM
          chmod 644 .certs/fieldops.pfx
      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
      - name: Build, migrate, and wait for services
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Probe services and reapply migrations
        run: |
          curl --fail http://localhost:5080/health/live
          curl --fail http://localhost:5080/health/ready
          curl --fail http://localhost:9000/minio/health/ready
          docker compose run --rm migrate
      - name: Exercise HTTPS web authentication and Mailpit
        run: python3 infrastructure/scripts/smoke-web-auth.py --ca .certs/fieldops.crt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run real admin browser workflows
        env:
          FIELDOPS_E2E_MAIL: http://localhost:8025
        run: |
          docker compose -f docker-compose.yml -f infrastructure/docker/compose.e2e.yml up -d --wait api
          npm run web:dev > /tmp/fieldops-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --insecure --fail --silent https://localhost:5173/login > /dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e --workspace=@fieldops/admin-web
      - name: Run mobile HTTP and session integration against PostgreSQL
        env:
          FIELDOPS_MOBILE_TEST_API: https://localhost:5443
          FIELDOPS_MOBILE_TEST_MAIL: http://localhost:8025
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/.certs/fieldops.crt
        run: npm run test:integration --workspace=@fieldops/mobile
      - name: Inspect failures
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop the disposable CI stack
        if: always()
        run: docker compose down --volumes
