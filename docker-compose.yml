name: fieldops

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fieldops}
      POSTGRES_USER: ${POSTGRES_USER:-fieldops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  migrate:
    image: fieldops-api:local
    build:
      context: .
      dockerfile: infrastructure/docker/Api.Dockerfile
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-fieldops};Username=${POSTGRES_USER:-fieldops};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: fieldops-api:local
    build:
      context: .
      dockerfile: infrastructure/docker/Api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-fieldops};Username=${POSTGRES_USER:-fieldops};Password=${POSTGRES_PASSWORD}
      ASPNETCORE_HTTPS_PORTS: 8443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/fieldops.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${FIELDOPS_HTTPS_CERT_PASSWORD:-}
      Cors__AllowedOrigins__0: https://localhost:5173
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set a random JWT_SIGNING_KEY of at least 64 characters in .env}
      DataProtection__KeyPath: /keys
      Email__Host: mailpit
      Email__Port: 1025
      Email__FromAddress: noreply@fieldops.test
      Email__UseStartTls: 'false'
    volumes:
      - api_keys:/keys
      - type: bind
        source: ${FIELDOPS_HTTPS_CERT_PATH:-./.certs/fieldops.pfx}
        target: /https/fieldops.pfx
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-5080}:8080"
      - "127.0.0.1:${API_HTTPS_PORT:-5443}:8443"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: fieldops-minio:local
    build:
      context: .
      dockerfile: infrastructure/docker/Minio.Dockerfile
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fieldops_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Copy .env.example to .env and set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  api_keys:
